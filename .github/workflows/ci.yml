name: CI

# Runs the same gates we run locally — lint, unit tests, and a production
# build — on every push and pull request. No secrets are needed: the app
# reads Supabase/Stripe/Gemini/Google config at request time, not at build.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
